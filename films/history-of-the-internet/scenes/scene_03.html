<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4F1EA; overflow: hidden; font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const remap = (t, t0, t1) => clamp((t - t0) / (t1 - t0), 0, 1);
const lerp = (a, b, p) => a + (b - a) * clamp(p);

const Easing = {
  outQuint: (x) => 1 - Math.pow(1 - clamp(x), 5),
  outCubic: (x) => 1 - Math.pow(1 - clamp(x), 3),
  inOutCubic: (x) => {
    x = clamp(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  },
  outBack: (x) => {
    x = clamp(x);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
};

function seededRandom(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function drawSwissGrid(ctx, width, height) {
  ctx.save();
  ctx.strokeStyle = 'rgba(17, 17, 17, 0.08)';
  ctx.lineWidth = 1;

  const colW = (width - 240) / 12;
  for (let i = 0; i <= 12; i++) {
    const x = 120 + i * colW;
    ctx.beginPath();
    ctx.moveTo(x, 60);
    ctx.lineTo(x, height - 60);
    ctx.stroke();
  }

  const rowH = (height - 160) / 8;
  for (let j = 0; j <= 8; j++) {
    const y = 80 + j * rowH;
    ctx.beginPath();
    ctx.moveTo(120, y);
    ctx.lineTo(width - 120, y);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(17, 17, 17, 0.25)';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  [0, 3, 6, 9, 12].forEach(col => {
    [0, 2, 4, 6, 8].forEach(row => {
      ctx.fillText('+', 120 + col * colW, 80 + row * rowH);
    });
  });
  ctx.restore();
}

window.renderFrame = function(t, duration = 8.1) {
  ctx.fillStyle = '#F4F1EA';
  ctx.fillRect(0, 0, 1920, 1080);

  drawSwissGrid(ctx, 1920, 1080);

  // ----------------------------------------------------
  // 1. FOLIO HEADERS
  // ----------------------------------------------------
  const folioProg = Easing.outCubic(remap(t, 0.1, 0.7));
  ctx.save();
  ctx.globalAlpha = folioProg;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 15px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('CHRONOLOGY OF THE INTERNET // VOL. 03', 120, 50);

  ctx.textAlign = 'center';
  ctx.fillText('AUGUST 6, 1991 • CERN • GENEVA, SWITZERLAND', 960, 50);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#FF2A00';
  ctx.fillText('THE WORLD WIDE WEB // TIM BERNERS-LEE', 1800, 50);
  ctx.restore();

  // ----------------------------------------------------
  // 2. HERO TYPOGRAPHY: 1991 // WWW
  // ----------------------------------------------------
  const yearP = Easing.outQuint(remap(t, 0.2, 1.2));
  const textP = Easing.outQuint(remap(t, 0.4, 1.3));

  ctx.save();
  ctx.fillStyle = '#111111';
  ctx.font = '900 130px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('1991', 120, 120 + (1 - yearP) * 50);

  // Giant Vermilion "W W W"
  if (yearP > 0.3) {
    const badgeW = 460;
    const badgeH = 54;
    ctx.fillStyle = '#FF2A00';
    ctx.fillRect(120, 275, badgeW * yearP, badgeH);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 28px "Helvetica Neue", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('WORLD WIDE WEB', 140, 275 + badgeH / 2);
  }

  ctx.globalAlpha = textP;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 36px "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('LINKING HUMAN KNOWLEDGE.', 120, 360 + (1 - textP) * 30);

  ctx.font = 'normal 22px "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = '#444444';
  ctx.fillText('Tim Berners-Lee introduces hypertext over the Internet on a NeXT workstation.', 120, 415);
  ctx.fillText('Documents across any server can now be reached instantly through hyperlinks.', 120, 445);
  ctx.restore();

  // ----------------------------------------------------
  // 3. FIRST URL ADDRESS BAR IN THE WORLD
  // ----------------------------------------------------
  const urlProg = Easing.outQuint(remap(t, 1.0, 2.0));
  if (urlProg > 0) {
    ctx.save();
    ctx.globalAlpha = urlProg;

    const urlX = 120;
    const urlY = 500;
    const urlW = 760;
    const urlH = 58;

    // URL Container
    ctx.fillStyle = '#111111';
    ctx.fillRect(urlX, urlY, urlW, urlH);

    // Indicator Dot
    ctx.fillStyle = '#FF2A00';
    ctx.beginPath();
    ctx.arc(urlX + 24, urlY + urlH / 2, 7, 0, Math.PI * 2);
    ctx.fill();

    // Text typing effect
    const fullUrl = 'http://info.cern.ch/hypertext/WWW/TheProject.html';
    const typeChars = Math.floor(lerp(0, fullUrl.length, clamp((t - 1.2) / 2.0)));
    const typedText = fullUrl.substring(0, typeChars);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(typedText, urlX + 46, urlY + urlH / 2);

    // Cursor
    if (t % 0.6 < 0.3) {
      const curW = ctx.measureText(typedText).width;
      ctx.fillStyle = '#FF2A00';
      ctx.fillRect(urlX + 50 + curW, urlY + 16, 10, 26);
    }
    ctx.restore();
  }

  // ----------------------------------------------------
  // 4. THE TRIAD OF OPEN WEB STANDARDS (Bottom Left)
  // ----------------------------------------------------
  const triadProg = Easing.outQuint(remap(t, 2.4, 3.4));
  if (triadProg > 0) {
    ctx.save();
    ctx.globalAlpha = triadProg;

    const standards = [
      { name: 'HTML', desc: 'Markup & Structure', detail: 'HyperText Markup Language' },
      { name: 'HTTP', desc: 'Transfer Protocol', detail: 'HyperText Transfer Protocol' },
      { name: 'URI / URL', desc: 'Universal Address', detail: 'Universal Resource Identifier' }
    ];

    const sW = 236;
    const sH = 140;
    const sGap = 26;
    const startX = 120;
    const startY = 590;

    standards.forEach((s, idx) => {
      const bx = startX + idx * (sW + sGap);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, startY, sW, sH);

      ctx.fillStyle = '#111111';
      ctx.fillRect(bx, startY, sW, 36);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 18px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(s.name, bx + sW / 2, startY + 24);

      ctx.fillStyle = '#FF2A00';
      ctx.font = 'bold 14px monospace';
      ctx.fillText(s.desc, bx + sW / 2, startY + 68);

      ctx.fillStyle = '#666666';
      ctx.font = 'normal 13px "Helvetica Neue", Arial, sans-serif';
      ctx.fillText(s.detail, bx + sW / 2, startY + 98);
    });

    ctx.restore();
  }

  // ----------------------------------------------------
  // 5. HYPERLINK MATRIX MESH GRAPHIC (Right Stage)
  // ----------------------------------------------------
  const webCenterX = 1400;
  const webCenterY = 480;

  // Expanding Concentric Rings
  ctx.save();
  const ringCount = 5;
  for (let r = 1; r <= ringCount; r++) {
    const ringT = remap(t, 0.4 + r * 0.3, 1.8 + r * 0.4);
    if (ringT <= 0) continue;
    const radius = r * 68 * Easing.outQuint(ringT);

    ctx.strokeStyle = (r === 3 || r === 5) ? '#FF2A00' : 'rgba(17, 17, 17, 0.2)';
    ctx.lineWidth = (r === 3) ? 2 : 1;
    ctx.setLineDash(r % 2 === 0 ? [8, 8] : []);
    ctx.beginPath();
    ctx.arc(webCenterX, webCenterY, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();

  // Hyperlinked Document Nodes
  const docNodes = [
    { title: 'INDEX.HTML', angle: 0, dist: 130, tIn: 1.0 },
    { title: 'PHYSICS.HTML', angle: Math.PI * 0.35, dist: 220, tIn: 1.6 },
    { title: 'RESEARCH.HTML', angle: Math.PI * 0.8, dist: 180, tIn: 2.2 },
    { title: 'DATABASE.HTML', angle: Math.PI * 1.25, dist: 240, tIn: 2.8 },
    { title: 'GLOBAL.HTML', angle: Math.PI * 1.7, dist: 190, tIn: 3.4 }
  ];

  ctx.save();
  // Tangent Hyperlink Rays
  docNodes.forEach((dn, i) => {
    if (t < dn.tIn) return;
    const dnProg = Easing.outBack(remap(t, dn.tIn, dn.tIn + 0.6));
    const targetX = webCenterX + Math.cos(dn.angle) * dn.dist;
    const targetY = webCenterY + Math.sin(dn.angle) * dn.dist;

    // Ray from Center
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(webCenterX, webCenterY);
    ctx.lineTo(lerp(webCenterX, targetX, dnProg), lerp(webCenterY, targetY, dnProg));
    ctx.stroke();

    // Cross-link ray between documents
    const nextNode = docNodes[(i + 1) % docNodes.length];
    if (t > nextNode.tIn) {
      const nextX = webCenterX + Math.cos(nextNode.angle) * nextNode.dist;
      const nextY = webCenterY + Math.sin(nextNode.angle) * nextNode.dist;
      ctx.strokeStyle = '#FF2A00';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(targetX, targetY);
      ctx.lineTo(nextX, nextY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Document Node Box
    if (dnProg > 0.4) {
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.fillRect(targetX - 60, targetY - 22, 120, 44);
      ctx.strokeRect(targetX - 60, targetY - 22, 120, 44);

      ctx.fillStyle = '#FF2A00';
      ctx.fillRect(targetX - 60, targetY - 22, 12, 44);

      ctx.fillStyle = '#111111';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(dn.title, targetX + 4, targetY);
    }
  });

  // Central CERN Origin Node
  const cernProg = Easing.outBack(remap(t, 0.4, 1.2));
  if (cernProg > 0) {
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.arc(webCenterX, webCenterY, 44 * cernProg, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FF2A00';
    ctx.beginPath();
    ctx.arc(webCenterX, webCenterY, 18 * cernProg, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CERN', webCenterX, webCenterY + 1);

    ctx.fillStyle = '#111111';
    ctx.font = 'bold 15px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText('ORIGIN: CERN (GENEVA)', webCenterX, webCenterY + 68);
  }
  ctx.restore();

  // ----------------------------------------------------
  // 6. BOTTOM BANNER
  // ----------------------------------------------------
  if (t > 5.4) {
    const footP = Easing.outCubic(remap(t, 5.4, 6.4));
    ctx.save();
    ctx.globalAlpha = footP;
    ctx.fillStyle = '#111111';
    ctx.fillRect(120, 870, 1680 * footP, 80);

    if (footP > 0.5) {
      ctx.fillStyle = '#F4F1EA';
      ctx.font = '900 28px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('THE WORLD WIDE WEB ENTERS THE PUBLIC DOMAIN (ROYALTY-FREE) • 1993', 160, 910);

      ctx.fillStyle = '#FF2A00';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('CERN // 1991', 1760, 910);
    }
    ctx.restore();
  }
};

if (!navigator.webdriver && !window.__OPUSCAR_HEADLESS__) {
  const defaultDuration = 8.1;
  const start = performance.now();
  function loop(now) {
    const t = ((now - start) / 1000) % defaultDuration;
    window.renderFrame(t, defaultDuration);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>

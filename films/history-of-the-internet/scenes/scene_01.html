<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4F1EA; overflow: hidden; font-family: 'Helvetica Neue', 'Arial Black', Arial, sans-serif; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const remap = (t, t0, t1) => clamp((t - t0) / (t1 - t0), 0, 1);
const lerp = (a, b, p) => a + (b - a) * clamp(p);

const Easing = {
  outQuint: (x) => 1 - Math.pow(1 - clamp(x), 5),
  outCubic: (x) => 1 - Math.pow(1 - clamp(x), 3),
  inOutCubic: (x) => {
    x = clamp(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  },
  outBack: (x) => {
    x = clamp(x);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
};

function seededRandom(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Draw Swiss Grid System
function drawSwissGrid(ctx, width, height) {
  ctx.save();
  ctx.strokeStyle = 'rgba(17, 17, 17, 0.08)';
  ctx.lineWidth = 1;

  // 12-Column Grid Lines
  const colW = (width - 240) / 12;
  for (let i = 0; i <= 12; i++) {
    const x = 120 + i * colW;
    ctx.beginPath();
    ctx.moveTo(x, 60);
    ctx.lineTo(x, height - 60);
    ctx.stroke();
  }

  // Horizontal Modular Rows
  const rowH = (height - 160) / 8;
  for (let j = 0; j <= 8; j++) {
    const y = 80 + j * rowH;
    ctx.beginPath();
    ctx.moveTo(120, y);
    ctx.lineTo(width - 120, y);
    ctx.stroke();
  }

  // Cross Ticks (+) at Key Intersections
  ctx.fillStyle = 'rgba(17, 17, 17, 0.25)';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  [0, 3, 6, 9, 12].forEach(col => {
    [0, 2, 4, 6, 8].forEach(row => {
      const cx = 120 + col * colW;
      const cy = 80 + row * rowH;
      ctx.fillText('+', cx, cy);
    });
  });

  ctx.restore();
}

window.renderFrame = function(t, duration = 7.9) {
  ctx.fillStyle = '#F4F1EA';
  ctx.fillRect(0, 0, 1920, 1080);

  // Background Swiss Grid
  drawSwissGrid(ctx, 1920, 1080);

  // ----------------------------------------------------
  // 1. FOLIO RUNNING HEADERS
  // ----------------------------------------------------
  const folioProg = Easing.outCubic(remap(t, 0.1, 0.7));
  ctx.save();
  ctx.globalAlpha = folioProg;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 15px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('CHRONOLOGY OF THE INTERNET // VOL. 01', 120, 50);

  ctx.textAlign = 'center';
  ctx.fillText('OCTOBER 29, 1969 • UCLA BOELTER HALL', 960, 50);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#FF2A00';
  ctx.fillText('ARPA IMP NETWORK // FIRST PACKET', 1800, 50);
  ctx.restore();

  // ----------------------------------------------------
  // 2. HERO TYPOGRAPHY: 1969 // ARPANET
  // ----------------------------------------------------
  const yearP = Easing.outQuint(remap(t, 0.2, 1.2));
  const subP = Easing.outQuint(remap(t, 0.5, 1.4));

  ctx.save();
  // Big Black Year "1969"
  ctx.fillStyle = '#111111';
  ctx.font = '900 130px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('1969', 120, 120 + (1 - yearP) * 50);

  // Swiss Vermilion Red Block Badge
  if (yearP > 0.3) {
    const badgeW = 440;
    const badgeH = 54;
    ctx.fillStyle = '#FF2A00';
    ctx.fillRect(120, 275, badgeW * yearP, badgeH);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 28px "Helvetica Neue", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('ARPANET COMMISSIONED', 140, 275 + badgeH / 2);
  }

  // Body Narrative Statement
  ctx.globalAlpha = subP;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 36px "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('FOUR UNIVERSITY NODES CONNECT.', 120, 360 + (1 - subP) * 30);

  ctx.font = 'normal 22px "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = '#444444';
  ctx.fillText('Department of Defense ARPA funds history\'s first resilient packet-switched network.', 120, 415);
  ctx.fillText('Packet switching breaks data into numbered chunks, bypassing line congestion.', 120, 445);
  ctx.restore();

  // ----------------------------------------------------
  // 3. THE FOUR-NODE TOPOLOGY DIAGRAM (Right Stage)
  // ----------------------------------------------------
  const nodes = [
    { id: 'NODE 01', name: 'UCLA', role: 'Interface Message Processor #1', x: 1040, y: 560, tIn: 0.6 },
    { id: 'NODE 02', name: 'SRI (STANFORD)', role: 'Interface Message Processor #2', x: 1040, y: 260, tIn: 1.0 },
    { id: 'NODE 03', name: 'UCSB', role: 'Culler-Fried Interactive Math', x: 1540, y: 560, tIn: 1.4 },
    { id: 'NODE 04', name: 'UTAH', role: 'Computer Graphics Center', x: 1540, y: 260, tIn: 1.8 }
  ];

  // Draw Interconnecting Links (50 kbps circuits)
  const links = [
    { from: 0, to: 1, label: '50 KBPS LINE', tIn: 1.2 },
    { from: 1, to: 3, label: '50 KBPS LINE', tIn: 2.0 },
    { from: 0, to: 2, label: '50 KBPS LINE', tIn: 1.6 },
    { from: 2, to: 3, label: '50 KBPS LINE', tIn: 2.2 }
  ];

  // Draw Lines
  ctx.save();
  links.forEach((l, idx) => {
    if (t < l.tIn) return;
    const lProg = Easing.outQuint(remap(t, l.tIn, l.tIn + 0.6));
    const n1 = nodes[l.from];
    const n2 = nodes[l.to];

    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(n1.x, n1.y);
    ctx.lineTo(lerp(n1.x, n2.x, lProg), lerp(n1.y, n2.y, lProg));
    ctx.stroke();

    // Circuit Tag
    if (lProg > 0.8) {
      const midX = (n1.x + n2.x) / 2;
      const midY = (n1.y + n2.y) / 2;
      ctx.fillStyle = '#F4F1EA';
      ctx.fillRect(midX - 55, midY - 14, 110, 28);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1;
      ctx.strokeRect(midX - 55, midY - 14, 110, 28);
      ctx.fillStyle = '#111111';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.label, midX, midY);
    }
  });
  ctx.restore();

  // Draw Nodes
  nodes.forEach((n, idx) => {
    if (t < n.tIn) return;
    const nProg = Easing.outBack(remap(t, n.tIn, n.tIn + 0.6));

    ctx.save();
    // Outer black circle
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.arc(n.x, n.y, 44 * nProg, 0, Math.PI * 2);
    ctx.fill();

    // Inner paper-white ring
    ctx.fillStyle = '#F4F1EA';
    ctx.beginPath();
    ctx.arc(n.x, n.y, 34 * nProg, 0, Math.PI * 2);
    ctx.fill();

    // Center Red Dot
    ctx.fillStyle = '#FF2A00';
    ctx.beginPath();
    ctx.arc(n.x, n.y, 14 * nProg, 0, Math.PI * 2);
    ctx.fill();

    // Node Metadata Labels
    if (nProg > 0.5) {
      ctx.fillStyle = '#111111';
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px "Helvetica Neue", Arial, sans-serif';
      ctx.fillText(n.name, n.x, n.y + 68);

      ctx.fillStyle = '#FF2A00';
      ctx.font = 'bold 14px monospace';
      ctx.fillText(n.id, n.x, n.y + 92);

      ctx.fillStyle = '#666666';
      ctx.font = 'normal 13px "Helvetica Neue", Arial, sans-serif';
      ctx.fillText(n.role, n.x, n.y + 112);
    }
    ctx.restore();
  });

  // ----------------------------------------------------
  // 4. THE FIRST PACKET ANIMATION (UCLA -> SRI)
  // ----------------------------------------------------
  if (t > 2.8) {
    const packetT = remap(t, 2.8, 5.2);
    const nUcla = nodes[0];
    const nSri = nodes[1];
    const curX = lerp(nUcla.x, nSri.x, packetT);
    const curY = lerp(nUcla.y, nSri.y, packetT);

    // Moving Red Packet Unit
    ctx.save();
    ctx.fillStyle = '#FF2A00';
    ctx.beginPath();
    ctx.arc(curX, curY, 18, 0, Math.PI * 2);
    ctx.fill();

    // Ripple Pulse around packet
    const pulseRad = 18 + ((t * 4) % 1) * 32;
    ctx.strokeStyle = `rgba(255, 42, 0, ${1 - ((t * 4) % 1)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(curX, curY, pulseRad, 0, Math.PI * 2);
    ctx.stroke();

    // Packet Label
    ctx.fillStyle = '#111111';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PKT #001', curX + 55, curY);
    ctx.restore();
  }

  // ----------------------------------------------------
  // 5. TERMINAL TRANSMISSION LOG: "L... O... CRASH"
  // ----------------------------------------------------
  if (t > 3.6) {
    const termProg = Easing.outQuint(remap(t, 3.6, 4.4));
    ctx.save();
    ctx.globalAlpha = termProg;

    const termX = 120;
    const termY = 560;
    const termW = 760;
    const termH = 260;

    // Stark Black Terminal Box
    ctx.fillStyle = '#111111';
    ctx.fillRect(termX, termY, termW, termH);

    // Swiss Vermilion Red Top Strip
    ctx.fillStyle = '#FF2A00';
    ctx.fillRect(termX, termY, termW, 36);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('TERMINAL TELETYPE // BBN IMP TELEMETRY • OCT 29 1969 22:30 PST', termX + 20, termY + 23);

    // Terminal Lines
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('> ATTEMPTING REMOTE LOGIN: UCLA -> SRI', termX + 30, termY + 85);

    // Character reveals
    if (t > 4.2) {
      ctx.fillStyle = '#4ADE80';
      ctx.fillText('> CHAR 1: \'L\' ... TRANSMITTED [ACKNOWLEDGED]', termX + 30, termY + 130);
    }
    if (t > 4.8) {
      ctx.fillStyle = '#4ADE80';
      ctx.fillText('> CHAR 2: \'O\' ... TRANSMITTED [ACKNOWLEDGED]', termX + 30, termY + 170);
    }
    if (t > 5.5) {
      ctx.fillStyle = '#FF2A00';
      ctx.fillText('> CHAR 3: \'G\' ... BUFFER OVERFLOW [SYSTEM CRASHED]', termX + 30, termY + 215);
    }
    ctx.restore();
  }

  // ----------------------------------------------------
  // 6. BOTTOM BANNER: HISTORICAL METRIC
  // ----------------------------------------------------
  if (t > 5.8) {
    const footP = Easing.outCubic(remap(t, 5.8, 6.8));
    ctx.save();
    ctx.globalAlpha = footP;
    ctx.fillStyle = '#111111';
    ctx.fillRect(120, 870, 1680 * footP, 80);

    if (footP > 0.5) {
      ctx.fillStyle = '#F4F1EA';
      ctx.font = '900 28px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('THE FIRST TWO LETTERS TRANSMITTED ACROSS CYBERSPACE: “ L O ”', 160, 910);

      ctx.fillStyle = '#FF2A00';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('4 NODES • 1969', 1760, 910);
    }
    ctx.restore();
  }
};

if (!navigator.webdriver && !window.__OPUSCAR_HEADLESS__) {
  const defaultDuration = 7.9;
  const start = performance.now();
  function loop(now) {
    const t = ((now - start) / 1000) % defaultDuration;
    window.renderFrame(t, defaultDuration);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
